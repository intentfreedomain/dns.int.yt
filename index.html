<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--
      These static tags are the homepage's, and the strings below must stay
      identical to HOME.title / HOME.description in src/data/site.js.
      tests/seo.test.js fails the suite if they drift, and scripts/prerender.mjs
      overwrites them per route with the same source. Do not hand-edit the
      wording here without changing the constant.
    -->
    <title>Free authoritative DNS with 1,000 records per domain · Intent-DNS</title>
    <meta
      name="description"
      content="Free authoritative DNS with 1,000 records per domain, plus apex ALIAS so your root domain can point at a hostname. Full REST API on every plan, 20 free domains, no credit card required."
    />
    <link rel="canonical" href="https://dns.int.yt/" />

    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#000000" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Intent-DNS" />
    <meta
      property="og:title"
      content="Free authoritative DNS with 1,000 records per domain · Intent-DNS"
    />
    <meta
      property="og:description"
      content="Free authoritative DNS with 1,000 records per domain, plus apex ALIAS so your root domain can point at a hostname."
    />
    <meta property="og:url" content="https://dns.int.yt/" />
    <meta property="og:image" content="https://dns.int.yt/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Intent-DNS — Free authoritative DNS with 1,000 records per domain"
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Free authoritative DNS with 1,000 records per domain · Intent-DNS"
    />
    <meta
      name="twitter:description"
      content="Free authoritative DNS with 1,000 records per domain, plus apex ALIAS so your root domain can point at a hostname."
    />
    <meta name="twitter:image" content="https://dns.int.yt/og.png" />
    <meta
      name="twitter:image:alt"
      content="Intent-DNS — Free authoritative DNS with 1,000 records per domain"
    />

    <!-- JSON-LD is injected at build time by scripts/prerender.mjs from
         src/data/schema.js, so it cannot drift from the rendered copy. -->

    <script type="module" src="/src/main.jsx"></script>
  </head>
  <body>
    <div id="root"></div>
    
    <!--
    ==========================================================
    INTENT DNS — COMMUNITY & EXTERNAL RECOGNITION
    ==========================================================

    This section highlights verified third-party recognition,
    startup directory listings, community features, project
    showcases, awards, and other external platforms featuring
    Intent DNS.

    Open-source contributors may add new verified listings here.
    Only include genuine recognitions with official links.

    ==========================================================
    -->

    <section
      id="community-recognition"
      aria-labelledby="recognition-heading"
      style="text-align:center;padding:24px 16px;"
    >
      <h2 id="recognition-heading">
        Intent DNS Across the Community
      </h2>

      <p>
        Discover Intent DNS on startup directories, product
        discovery platforms, and communities supporting
        independent and open-source projects.
      </p>

      <!-- Smol Startup -->
      <div class="external-recognition" id="smol-startup">
        <a
          href="https://smolstartup.com/projects/intent-dns?utm_source=badge"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Intent DNS featured on Smol Startup"
        >
          <img
            src="https://smolstartup.com/images/badges/featured-on-dark.svg"
            alt="Featured on Smol Startup"
            style="height:44px;width:auto;"
          />
        </a>
      </div>

      <!--
      FUTURE VERIFIED LISTINGS:

      Add official badges and links for:
      - PeerPush
      - Product Hunt
      - Other startup directories
      - Open-source communities

      -->

    </section>

    <!-- END INTENT DNS COMMUNITY & EXTERNAL RECOGNITION -->

  </body>
</html>
