<!--
  Intent wordmark.

  viewBox is cropped to the ink (60 86 696 182) rather than the 0 0 800 360 box
  the paths were exported into. The original canvas was 56% empty padding, so
  the wordmark rendered at half the height it was given — the same defect as the
  old 512x512 PNG, where six letters inside a square canvas came out ~7px tall in
  a 30px slot. Ink aspect here is 3.82, matching a tight render of the same
  wordmark (3.79).
-->
